<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Kanban board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🗂️ TaskFlow</h1>
  <p>A lightweight Kanban board. Drag cards between columns, tag them with labels, double-click a card to edit it, and shape the board with your own columns — everything saves in your browser.</p>
</header>

<form id="addForm">
  <input id="taskTitle" placeholder="New task… e.g. Finish DSA assignment" required maxlength="80">
  <select id="taskCol"></select>
  <button type="submit">Add task</button>
</form>

<form id="addColForm" class="addcol">
  <input id="colName" placeholder="New column name… e.g. Review" required maxlength="30">
  <button type="submit">+ Add column</button>
</form>

<main class="board" id="board"></main>

<footer>TaskFlow · vanilla JS + localStorage · MIT</footer>
<script src="app.js"></script>
</body>
</html>
